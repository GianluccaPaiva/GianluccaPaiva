name: Atualizar tecnologias do README

on:
  schedule:
    - cron: "0 6 * * *" # todo dia, 03:00 no horário de Brasília
  workflow_dispatch: # permite rodar manualmente na aba Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detectar tecnologias dos repositórios
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/update_readme.py

      - name: Commitar apenas se houver mudança
        run: |
          if git diff --quiet -- README.md; then
            echo "README já está atualizado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: atualiza tecnologias do README automaticamente"
            git push
          fi
